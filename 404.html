<html>
    <head>
        <meta charset="utf-8">
        <title>Railway Ticket Booking App</title>
        <script type="text/javascript">
        // GitHub Pages SPA Router Hack
        var pathSegmentsToKeep = 1; // Удерживаем 1 сегмент (имя репозитория)
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, pathSegmentsToKeep).join('/') + '/?p=' +
            l.pathname.split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' : '') + l.search.slice(1).replace(/&/g, '~and~') + l.hash
        );
        </script>
    </head>
    <body>
    </body>
</html>
